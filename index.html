<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Pango Dash</title>
<style>
/* Layout: landscape-first handheld — the pixel screen fills the phone sideways, pad + jump float over its lower corners; desktop gets a key legend */
:root{
  --bg:#0b0c1d; --bezel:#171a3c; --edge:#2b2f6a; --ink:#eef0ff; --dim:#8d93cb;
  --amber:#ffc53a; --amber-d:#b8631a; --teal:#2ad1bf; --teal-d:#13838a; --pad:#23264f; --pad-hi:#343872;
  --pixel:ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--pixel);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse at 50% -10%,#1d2156 0%,var(--bg) 65%);
}
#app{height:100%;box-sizing:border-box;padding-block:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#screen{position:relative;line-height:0;flex:none}
#game{display:block;image-rendering:crisp-edges;image-rendering:pixelated;border-radius:3px;
  box-shadow:0 0 0 3px var(--bezel),0 0 0 5px var(--edge),0 18px 40px rgba(0,0,0,.55);background:#000;outline:none}
#hudBtns{position:absolute;top:6px;right:6px;display:flex;gap:6px}
#fx{position:absolute;left:0;top:0;pointer-events:none;display:none;border-radius:3px}
#fx.scan,#fx.crt{display:block;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--px,3px)*0.55),rgba(0,0,0,.26) calc(var(--px,3px)*0.55),rgba(0,0,0,.26) var(--px,3px))}
#fx.crt{background-image:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,.5) 100%),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--px,3px)*0.5),rgba(0,0,0,.32) calc(var(--px,3px)*0.5),rgba(0,0,0,.32) var(--px,3px)),repeating-linear-gradient(to right,rgba(255,60,60,.05) 0,rgba(255,60,60,.05) 1px,rgba(60,255,120,.05) 1px,rgba(60,255,120,.05) 2px,rgba(80,120,255,.05) 2px,rgba(80,120,255,.05) 3px);box-shadow:inset 0 0 calc(var(--px,3px)*10) rgba(120,160,255,.18)}
#game.crt{filter:saturate(1.15) contrast(1.06) brightness(1.06)}
#hudBtns button{width:30px;height:30px;padding:0;display:grid;place-items:center;border-radius:6px;cursor:pointer;
  background:rgba(11,12,29,.55);border:2px solid rgba(255,255,255,.18);color:var(--ink)}
#hudBtns button:focus-visible,#keys button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#hudBtns svg{width:14px;height:14px;fill:currentColor}
#keys{font-size:9px;line-height:2.1;color:var(--dim);text-align:center;max-width:680px;margin:0}
#keys kbd{font-family:var(--pixel);font-size:8px;color:var(--ink);background:var(--pad);border:1px solid var(--edge);border-bottom-width:3px;border-radius:4px;padding:3px 5px;margin:0 2px}
#keys .sep{color:var(--edge);margin:0 6px}
#pad{display:none;width:100%;max-width:520px;flex:1 1 auto;min-height:0;align-items:center;justify-content:space-between;gap:16px;touch-action:none}
.dpad{position:relative;width:156px;height:156px;flex:none;touch-action:none}
@media (pointer:coarse) and (orientation:portrait){.dpad{transform:scale(1.1);transform-origin:center}.jump{width:116px;height:116px}.btnwrap{gap:18px}}
.dpad .arm{position:absolute;background:var(--pad);border:2px solid var(--edge);display:grid;place-items:center;color:var(--dim);transition:background .06s}
.dpad .arm.on{background:var(--pad-hi);color:var(--amber)}
.dpad .h{top:52px;width:58px;height:52px}
.dpad .l{left:0;border-radius:10px 0 0 10px;border-right:0}
.dpad .r{right:0;border-radius:0 10px 10px 0;border-left:0}
.dpad .v{left:52px;width:52px;height:58px}
.dpad .u{top:0;border-radius:10px 10px 0 0;border-bottom:0;opacity:.55}
.dpad .d{bottom:0;border-radius:0 0 10px 10px;border-top:0}
.dpad .hub{position:absolute;left:52px;top:52px;width:52px;height:52px;background:var(--pad);border-top:2px solid var(--edge);border-bottom:2px solid var(--edge)}
.dpad .hub::after{content:"";position:absolute;inset:14px;border-radius:50%;background:#1a1d40;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.dpad svg{width:18px;height:18px;fill:currentColor}
.btnwrap{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.jump{width:104px;height:104px;border-radius:50%;background:var(--amber);border:3px solid #6e3410;
  box-shadow:inset 0 -8px 0 var(--amber-d),inset 0 4px 0 #ffe6a0,0 6px 0 #3a1a08;color:#4a1e06;font:10px var(--pixel);
  display:grid;place-items:center;touch-action:none;transition:transform .05s}
.jump.on{transform:translateY(4px);box-shadow:inset 0 -4px 0 var(--amber-d),inset 0 4px 0 #ffe6a0,0 2px 0 #3a1a08}
.tip{font-size:7px;color:var(--dim);letter-spacing:.06em;text-align:center;line-height:1.7}
@media (pointer:coarse){
  #pad{display:flex}
  #keys{display:none}
}
@media (pointer:coarse) and (orientation:landscape){
  #app{gap:0;padding-block:0}
  #game{border-radius:0;box-shadow:none}
  #pad{position:fixed;left:0;right:0;bottom:0;max-width:none;flex:none;pointer-events:none;align-items:flex-end;
    padding:0 max(26px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));box-sizing:border-box}
  #pad>*{pointer-events:auto;opacity:.55}
  .dpad{transform:scale(calc(1.12 * var(--bs,1)));transform-origin:bottom left}
  .btnwrap{transform:none}
  #pad>.btnwrap:last-child{transform:scale(var(--bs,1));transform-origin:bottom right}
  #pad{padding-bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + var(--lift,0px))}
  body.swap #pad{flex-direction:row-reverse}
  body.swap .dpad{transform-origin:bottom right}
  body.swap #pad>.btnwrap:last-child{transform-origin:bottom left}
  .tip{display:none}
  #hudBtns{top:max(6px,env(safe-area-inset-top,0px))}
}
#rotate{position:fixed;inset:0;z-index:20;display:none;place-items:center;text-align:center;background:var(--bg);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#rotate .box{display:grid;justify-items:center;gap:18px;max-width:300px}
#rotate .phone{width:46px;height:78px;border:4px solid var(--amber);border-radius:9px;position:relative;animation:tilt 2.4s ease-in-out infinite}
#rotate .phone::after{content:"";position:absolute;left:50%;bottom:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--amber)}
@keyframes tilt{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rotate h2{margin:0;font:12px/1.8 var(--pixel);color:var(--ink);text-wrap:balance}
#rotate p{margin:0;font:8px/2 var(--pixel);color:var(--dim)}
#rotate button{font:9px var(--pixel);color:#4a1e06;background:var(--amber);border:3px solid #6e3410;border-radius:8px;padding:10px 14px;cursor:pointer}
#rotate button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
body.portrait:not(.upright) #rotate{display:grid}
@media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.jump,.dpad .arm{transition:none}}
</style>

<div id="app">
  <div id="screen">
    <canvas id="game" width="320" height="224" tabindex="0" aria-label="Pango Dash game screen"></canvas>
    <div id="fx" aria-hidden="true"></div>
    <div id="hudBtns">
      <button id="btnPause" type="button" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></svg></button>
      <button id="btnFull" type="button" aria-label="Full screen" hidden><svg viewBox="0 0 16 16"><path d="M2 2h5v2H4v3H2zM9 2h5v5h-2V4H9zM2 9h2v3h3v2H2zM12 9h2v5H9v-2h3z"/></svg></button>
      <button id="btnMute" type="button" aria-label="Sound on or off"><svg id="icoSnd" viewBox="0 0 16 16"><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M11 5.5c1 .8 1.5 1.6 1.5 2.5s-.5 1.7-1.5 2.5l-.8-.9c.7-.5 1-1 1-1.6s-.3-1.1-1-1.6z"/></svg></button>
    </div>
  </div>
  <div id="pad">
    <div class="btnwrap">
      <div class="dpad" id="dpad" aria-label="Direction pad">
        <div class="arm h l" data-k="l"><svg viewBox="0 0 16 16"><path d="M10 3 4 8l6 5z"/></svg></div>
        <div class="arm h r" data-k="r"><svg viewBox="0 0 16 16"><path d="m6 3 6 5-6 5z"/></svg></div>
        <div class="arm v u" data-k="u"><svg viewBox="0 0 16 16"><path d="M3 10 8 4l5 6z"/></svg></div>
        <div class="arm v d" data-k="d"><svg viewBox="0 0 16 16"><path d="M3 6h10l-5 6z"/></svg></div>
        <div class="hub"></div>
      </div>
      <div class="tip">DOWN = ROLL<br>HOLD DOWN + TAP JUMP = CHARGE</div>
    </div>
    <div class="btnwrap">
      <div class="jump" id="btnJump" role="button" aria-label="Jump">JUMP</div>
      <div class="tip">TAP SCREEN<br>TO START</div>
    </div>
  </div>
  <div id="rotate"><div class="box"><div class="phone" aria-hidden="true"></div><h2>Turn your phone sideways</h2><p>Pango Dash is built for landscape</p><button id="btnUpright" type="button">Play upright anyway</button></div></div>
<p id="keys"><kbd>←</kbd><kbd>→</kbd> run<span class="sep">/</span><kbd>↓</kbd> roll<span class="sep">/</span><kbd>Z</kbd> or <kbd>Space</kbd> jump<span class="sep">/</span>hold <kbd>↓</kbd> + tap jump to charge a dash<span class="sep">/</span><kbd>Enter</kbd> start · pause<span class="sep">/</span><kbd>M</kbd> sound</p>
</div>

<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
const VH=224; let VW=320;
const cv=$('game'); let ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const hash1=x=>hash2(x,7919);
function hexrgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function pk(h){const[r,g,b]=hexrgb(h);return((255<<24)|(b<<16)|(g<<8)|r)>>>0;}

/* ================= PALETTE + PIXEL GRID ================= */
const PAL=[[0,0,0]],C={};
[['O','#1b1033'],['s1','#5e2614'],['s2','#9c4421'],['s3','#d4702f'],['s4','#f3a24a'],['s5','#ffdc94'],
 ['k1','#f8d6ae'],['k2','#d9a07a'],['k3','#a8684c'],['nose','#3a1f2e'],['eye','#140b24'],['w','#ffffff'],['blush','#ff8aa0'],
 ['f1','#2ad1bf'],['f2','#13838a'],['f3','#a6fff0'],
 ['r1','#7d1830'],['r2','#d83a3f'],['r3','#ff7a68'],['m1','#3f4660'],['m2','#8e97ad'],['m3','#dfe5f2'],['y2','#ffd23f'],['t1','#231c33'],
 ['b1','#2b2d86'],['b2','#5562dc'],['b3','#9aa4ff'],['gl','#86f2ff'],['wing','#d9f7ff'],
 ['a1','#fff4b0'],['a2','#ffd04a'],['a3','#f1931f'],['a4','#ad5510'],['ao','#4a1d08'],
 ['wd1','#e8a35d'],['wd2','#b86d34'],['wd3','#7a4220'],
 ['g1','#c6f57e'],['g2','#6fd04b'],['g3','#2f9e45'],['g4','#1b6338'],
 ['tr1','#e09a52'],['tr2','#a8602c'],['tr3','#6d3a1e'],
 ['c1','#d4fff7'],['c2','#46e3d1'],['c3','#1c9c9e'],['c4','#0e5a66'],
 ['sh1','#d8f2ff'],['sh2','#6cc0ff'],['sh3','#2f7fe0'],
 ['fl1','#ff6fa8'],['fl2','#fff27a'],['fl3','#ffffff'],['fl4','#c2357a'],
 ['x1','#ffffff'],['x2','#fff3a0'],['x3','#ffb43c'],['x4','#e8542c'],['x5','#9a9ab8'],['x6','#5d5d7a'],
 ['cl1','#ffffff'],['cl2','#e2f2ff'],['cl3','#b2d9f6'],
 ['st1','#8a86a8'],['st2','#5d5a7e'],['st3','#c4c1dc'],['cp1','#ffeedd'],['cp2','#f9b9a8'],['cp3','#c97aa0'],['mA','#1d2034'],['mC','#5f6782'],['mB','#b6bed2'],['b0','#191a52'],['bM','#3a41ad'],['b4','#cdd3ff'],['gl0','#1a5f78'],['gl1','#3aaed0'],['gl2','#cdfcff'],['y0','#8f4f08'],['y1','#d68d10'],['y3','#fff2a6'],['t2','#3a3150'],['t3','#575072'],['r0','#4a0c1e'],['r4','#ffd0c0'],['wg1','#e8fbff'],['wg2','#a6dcf0'],['wg3','#6aaed2'],['fi1','#fff2b0'],['fi2','#ffae3a'],['fi3','#e8542c'],['q0','#0b2b31'],['q1','#174a4f'],['q2','#1e5f60'],['q3','#277873'],['q4','#3a9888'],['q5','#7ad0bc'],['os1','#fff4d6'],['os2','#ffd59a'],['os3','#e8a060'],['lp0','#0c1840'],['lp1','#1a3a86'],['lp2','#3a6ad0'],['lp3','#8fb0ff'],['nc1','#4a3a78'],['nc2','#36295e'],['nc3','#271d48'],['pu0','#1e0f2e'],['pu1','#3c1d55'],['pu2','#5e2f80'],['pu3','#8a4cad'],['pu4','#c08ae0'],['pu5','#ead0ff']
].forEach(([n,h])=>{C[n]=PAL.length;PAL.push(hexrgb(h));});

class G{
  constructor(w,h){this.w=w;this.h=h;this.d=new Uint8Array(w*h);}
  set(x,y,v){x=Math.floor(x);y=Math.floor(y);if(v&&x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=v;}
  ell(cx,cy,rx,ry,f){const x0=Math.floor(cx-rx-1),x1=Math.ceil(cx+rx+1),y0=Math.floor(cy-ry-1),y1=Math.ceil(cy+ry+1);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;
      if(nx*nx+ny*ny<=1){const v=typeof f==='number'?f:f(x,y,nx,ny);if(v)this.set(x,y,v);}}}
  rect(x0,y0,w,h,f){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++){const v=typeof f==='number'?f:f(x,y);if(v)this.set(x,y,v);}}
  line(x0,y0,x1,y1,r,f){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2)+1;for(let i=0;i<=n;i++){const t=i/n;this.ell(x0+(x1-x0)*t,y0+(y1-y0)*t,r,r,f);}}
  outline(o){const s=this.d.slice(),w=this.w,h=this.h;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(s[y*w+x])continue;
      if((x>0&&s[y*w+x-1])||(x<w-1&&s[y*w+x+1])||(y>0&&s[(y-1)*w+x])||(y<h-1&&s[(y+1)*w+x]))this.d[y*w+x]=o;}return this;}
  mono(v){const g=new G(this.w,this.h);for(let i=0;i<this.d.length;i++)if(this.d[i])g.d[i]=v;return g;}
  canvas(map){const c=mk(this.w,this.h),x=c.getContext('2d'),im=x.createImageData(this.w,this.h);
    for(let i=0;i<this.d.length;i++){let v=this.d[i];if(v){if(map&&map[v])v=map[v];const p=PAL[v];im.data[i*4]=p[0];im.data[i*4+1]=p[1];im.data[i*4+2]=p[2];im.data[i*4+3]=255;}}
    x.putImageData(im,0,0);c._px=new Uint32Array(im.data.buffer.slice(0));return c;}
}

/* ================= SPRITES: PIP THE PANGOLIN ================= */
function scl(x,y,light){const r=Math.floor(y/4),ly=y-r*4,lx=(((x+(r&1)*2)%5)+5)%5;
  if(ly===3)return C.s1;if(lx===0)return C.s2;
  if(light>0.5)return(ly===0&&lx===2)?C.s5:C.s4;if(light>-0.05)return C.s3;return C.s2;}
function scarf(g,x0,y0,L,lift,flap){
  for(let i=0;i<=16;i++){const t=i/16,x=x0-t*L,y=y0-t*lift+Math.sin(t*6.5+flap)*(0.6+t*2),r=1.9-t*0.7;
    g.ell(x,y,r,r,(px,py)=>py+.5>y+.3?C.f2:(t>0.82?C.f3:C.f1));}
}
function pango(o){
  // a 48-wide frame: the body sits where it always did, with 8px of room behind it for the tail to swing
  const OX=8,g0=new G(48,40),wf=f=>typeof f==='number'?f:(x,y,nx,ny)=>f(x-OX,y,nx,ny),
    g={set:(x,y,v)=>g0.set(x+OX,y,v),ell:(cx,cy,rx,ry,f)=>g0.ell(cx+OX,cy,rx,ry,wf(f)),rect:(x,y,w,h,f)=>g0.rect(x+OX,y,w,h,typeof f==='number'?f:(px,py)=>f(px-OX,py)),line:(x0,y0,x1,y1,r,f)=>g0.line(x0+OX,y0,x1+OX,y1,r,wf(f))};
  const b=o.bob||0,sp=o.speed||0;
  const leg=(hx,hy,f,col)=>{g.line(hx,hy,f[0],f[1]-1,1.7,col);g.rect(Math.round(f[0])-1,Math.round(f[1]),3,1,C.t1);};
  scarf(g,23,20.5+b,11+sp*8,sp*4,o.flap||0);
  leg(15,30+b,o.fb,C.s1);leg(26,30+b,o.ff,C.s1);
  // the tail: tw lifts it from hanging (0) to streaming out behind (1); tc flicks the tip
  const tw=o.tw||0,tc=o.tc||0,mx=1.6-3.5*tw,my=28+b-2*tw,ex=Math.max(-6,4-9*tw+tc),ey=37.5+b-9.5*tw-tc*0.9*(1-tw*0.5);
  for(let i=0;i<=14;i++){const t=i/14,u=1-t,x=u*u*10+2*u*t*mx+t*t*ex,y=u*u*(27+b)+2*u*t*my+t*t*ey,r=4.8-3*t;
    g.ell(x,y,r,r,(px,py,nx,ny)=>scl(px,py-b,-ny));}
  g.ell(18.5,25.5+b,11,8.5,(x,y,nx,ny)=>(ny>0.5&&nx>-0.5)?(ny>0.78?C.k2:C.k1):scl(x,y-b,-ny-nx*0.25));
  g.ell(29.5,24.5+b,5.6,4.8,(x,y,nx,ny)=>(ny<-0.2&&nx<0.45)?scl(x,y-b,0.9):(ny>0.55?C.k2:C.k1));
  g.ell(34.6,26.6+b,4.2,2.3,(x,y,nx,ny)=>ny>0.4?C.k2:C.k1);
  g.set(38,26+b,C.nose);g.set(38,27+b,C.nose);g.set(33,28+b,C.blush);g.set(34,28+b,C.blush);
  leg(13,31+b,o.nb,C.s2);leg(24,31+b,o.nf,C.s3);
  for(let y=19;y<=28;y++){const c=25.4-(y-19)*0.3;for(let x=Math.round(c-1.4);x<=Math.round(c+1.2);x++)g.set(x,y+b,x<c-0.4?C.f2:(y===19?C.f3:C.f1));}
  if(o.hurt)[[30,22],[32,22],[31,23],[30,24],[32,24]].forEach(([x,y])=>g.set(x,y+b,C.eye));
  else if(o.blink)g.rect(30,24+b,3,1,C.eye);
  else{g.rect(31,22+b,2,3,C.eye);g.set(32,22+b,C.w);}
  return g0.outline(C.O).canvas();
}

function buildTrack(xs,xe){

    if(state==='options'){while(navQ.length){const k=navQ.shift();if(k==='u'){optSel=(optSel+OPT_ROWS.length-1)%OPT_ROWS.length;sfx('tick');}else if(k==='d'){optSel=(optSel+1)%OPT_ROWS.length;sfx('tick');}else if(k==='l')optChange(-1);else if(k==='r')optChange(1);}}

/* ---- act-clear screen: an ACT CLEAR ribbon, then a results panel that fills in line by line ---- */
function iconClock(x,y){pxDisc(x+6,y+6,6,'#140b33');pxDisc(x+6,y+6,5,'#ffffff');ctx.fillStyle='#e8455a';ctx.fillRect(x+6,y+2,1,5);ctx.fillStyle='#140b33';ctx.fillRect(x+6,y+6,3,1);ctx.fillRect(x+5,y-1,3,2);}

  for(const[dx,dy,w]of P){ctx.fillStyle=dy<2?'#fff1a8':'#ffc53a';ctx.fillRect(x+dx,y+dy*2,w,2);}}

function render(){

/* ================= LAYOUT + LOOP ================= */
let COARSE=false;
function layout(){
  COARSE=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
  const land=innerWidth>=innerHeight;document.body.classList.toggle('portrait',COARSE&&!land);
  const app=$('app');if(!app)return;const W=app.clientWidth||innerWidth,H=innerHeight;let bw=W,bh;
  if(COARSE&&!land){bh=H*0.58;VW=320;}
  else{const keys=$('keys');bh=COARSE?H:H-24-(keys?keys.offsetHeight+16:0);VW=clamp(Math.round(VH*bw/bh/2)*2,320,480);}
  if(cv.width!==VW){cv.width=VW;cv.height=VH;}ctx.imageSmoothingEnabled=false;
  let s=Math.min(bw/VW,bh/VH);if(s>=3&&!COARSE)s=Math.floor(s);
  cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';
  const fx=$('fx');if(fx){fx.style.width=cv.style.width;fx.style.height=cv.style.height;if(fx.style.setProperty)fx.style.setProperty('--px',(Math.floor(VH*s)/VH)+'px');}}
$('btnUpright')&&$('btnUpright').addEventListener('click',()=>{document.body.classList.add('upright');layout();});
(()=>{const b=$('btnFull'),de=document.documentElement;if(!b||!(document.fullscreenEnabled&&de.requestFullscreen))return;b.hidden=false;
  b.addEventListener('click',e=>{e.stopPropagation();if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return;}
    de.requestFullscreen().then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(_){}}).catch(()=>{});});
  document.addEventListener('fullscreenchange',()=>setTimeout(layout,60));})();
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));
layout();applyOpts();
let acc=0,last=0;
function frame(ts){requestAnimationFrame(frame);if(!last)last=ts;let dt=(ts-last)/1000;last=ts;if(dt>0.1)dt=0.1;acc+=dt;let n=0;
  while(acc>=1/60&&n<5){step();acc-=1/60;n++;}if(n>=5)acc=0;render();if(state!=='bonus'&&state!=='bonusEnd')chunkPrefetch(2.5);}
buildLevel(1);resetObjects();resetPlayer(96);
requestAnimationFrame(frame);
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
